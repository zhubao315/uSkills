name: Bug Report
description: Report a bug in core engine, schema, docs, or workflows.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Steps, inputs, and skill files involved.
    validations:
      required: true
