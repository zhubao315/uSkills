skill_id: uskill-atomic-text-translate-v1-0-0
meta:
  name: 文本翻译
  version: "1.0.0"
  category: atomic
  domain: nlp
  description: 将文本从源语言翻译到目标语言，保持原意和风格。
  tags:
    - nlp
    - translate
    - atomic
  owner: uSkills
input:
  params:
    - name: text
      type: string
      required: true
      description: 待翻译的文本
    - name: source_lang
      type: string
      required: false
      description: 源语言代码（auto 为自动检测）
      default: auto
    - name: target_lang
      type: string
      required: true
      description: 目标语言代码（如 en, zh, ja）
execute:
  prompt_template: |
    请将以下文本翻译为 {{target_lang}}：

    {{text}}

    翻译要求：
    1. 保持原文的语气和风格
    2. 专业术语保持准确
    3. 保持原文格式（如列表、段落）

    输出 JSON：
    {
      "translated_text": "翻译后的文本",
      "detected_source_lang": "检测到的源语言",
      "confidence": 0.95
    }
  steps:
    - 检测源语言
    - 翻译文本
    - 校验翻译质量
  temperature: 0.2
  model: gpt-4o-mini
  tools: []
  fallback:
    - machine-translation-api
output:
  format: json
  params:
    - translated_text
    - detected_source_lang
    - confidence
  validation_rules:
    - translated_text 不能为空
    - confidence 在 0-1 之间
control:
  timeout: 20
  retry: 2
  interrupt: true
  breakpoint_allowed: true
  mockable: true
source:
  sop_name: NLP 基础技能集
  sop_path: examples/nlp_sop.md
  step_index: 2
  raw_step: 将文本从源语言翻译到目标语言
