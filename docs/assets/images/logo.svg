  </defs>
  
  <!-- Hexagon Icon Base -->
  <path d="M64 15 L108 40 V90 L64 115 L20 90 V40 Z" fill="none" stroke="url(#warmGradient)" stroke-width="8" stroke-linejoin="round" />
  
