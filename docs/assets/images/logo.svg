<svg width="512" height="128" viewBox="0 0 512 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="strikeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF3D00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF9100;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dynamic S Icon -->
  <g filter="url(#glow)">
    <!-- Top Half of S -->
    <path d="M100 25 H40 C30 25 25 30 25 40 V55 C25 65 30 70 40 70 H80 C90 70 95 75 95 85 V100" fill="none" stroke="url(#strikeGradient)" stroke-width="22" stroke-linecap="round" />
    <!-- Bottom Half of S -->
    <path d="M25 103 H85 C95 103 100 98 100 88 V73 C100 63 95 58 85 58 H45 C35 58 30 53 30 43 V25" fill="none" stroke="url(#strikeGradient)" stroke-width="22" stroke-linecap="round" />
    <!-- Center Bolt Cut -->
    <path d="M50 64 L75 64" stroke="#FFF" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Text Part -->
  <text x="140" y="85" font-family="Segoe UI, Impact, Arial Black, sans-serif" font-weight="900" font-size="82" fill="#212121">
    <tspan fill="#616161" font-weight="400">u</tspan>Skills
  </text>
  <text x="142" y="112" font-family="Verdana, sans-serif" font-size="14" font-weight="bold" fill="#FF3D00" letter-spacing="6">POWERED AGENT FOUNDATION</text>
</svg>
