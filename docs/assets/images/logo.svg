  <circle cx="64" cy="40" r="7" fill="#FFD600" />
  
  <!-- Text Part -->
  <text x="140" y="82" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="78" fill="#4E342E">uSkills</text>
